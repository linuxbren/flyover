[package]
name = "flyover"
version = "0.3.0"
edition = "2024"
description = "A real-time ADS-B radar scope for your terminal, built for Omarchy"
license = "MIT"
readme = "README.md"
repository = "https://github.com/linuxbren/flyover"
keywords = ["adsb", "radar", "tui", "omarchy", "aviation"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
crossterm = "0.29.0"
csv = "1.3.1"
fontdue = "0.9.4"
image = "0.25.10"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["image-defaults", "crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.12.0"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
